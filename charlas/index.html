<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Charlas — Gabriel Aufgang</title>
<meta name="description" content="Charlas de Gabriel Aufgang sobre creatividad, comunicación y experiencias humanas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A1A1A;--fg:#F5F2EC;--acc:#27D3CC;--dim:rgba(245,242,236,.55);--line:rgba(245,242,236,.1);--card:#222;--pad:clamp(16px,5vw,64px)}
:root[data-theme="light"]{--bg:#F5F2EC;--fg:#1A1A1A;--acc:#14a29c;--dim:rgba(26,26,26,.6);--line:rgba(26,26,26,.12);--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
header{display:flex;align-items:center;gap:14px;padding:22px 0}
.h-gauf{height:22px;width:auto;fill:currentColor}
.h-gauf path{fill:currentColor}
header .t{font:600 12px Archivo;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
header .sp{flex:1}
.theme{width:36px;height:36px;border:1px solid var(--line);border-radius:50%}
.hero{padding:clamp(24px,6vh,64px) 0 clamp(20px,4vh,40px)}
.hero h1{font:400 clamp(34px,7vw,72px)/1 'Archivo Black';letter-spacing:-.01em}
.hero h1 span{color:var(--acc)}
.hero p{margin-top:14px;color:var(--dim);max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px;padding-bottom:60px}
.card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.cover{aspect-ratio:16/9;background:#111 center/cover no-repeat;display:flex;align-items:flex-end;padding:16px}
.cover.none{background:linear-gradient(135deg,#1A1A1A 0%,#123c3a 100%)}
.cover.none b{font:400 22px/1.1 'Archivo Black';color:#F5F2EC}
.cbody{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h2{font:400 20px/1.15 'Archivo Black'}
.cbody p{color:var(--dim);font-size:15px}
.tags{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:#1A1A1A}
.btn.main:hover{color:#1A1A1A;filter:brightness(1.08)}
.detail{max-width:760px;padding:10px 0 70px}
.back{color:var(--dim);font-size:14px;margin-bottom:22px}
.back:hover{color:var(--acc)}
.detail .cover{border-radius:14px;margin-bottom:26px}
.detail h1{font:400 clamp(30px,6vw,52px)/1.05 'Archivo Black';margin:8px 0 16px}
.idea{font-size:clamp(18px,2.4vw,22px);font-weight:300}
.sec{margin-top:34px}
.sl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.q{font-size:18px;border-left:3px solid var(--acc);padding-left:14px}
.conv{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.conv .ev{font-weight:600}
.conv .meta{color:var(--dim);font-size:14px}
.conv .btns{margin-top:8px}
.empty{color:var(--dim);padding:40px 0}
footer{border-top:1px solid var(--line);padding:20px 0 30px;display:flex;justify-content:space-between;color:var(--dim);font-size:13px}
footer a:hover{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>
<script>
/* ═══════════════════════════════════════════════════════
   INDEX DE CHARLAS — lee charlas.json (lo publica admin.html).
   Se muestra:  charlas con editorialStatus "public"
                recursos con public !== false
                conversaciones con visible !== false
   Lo oculto queda guardado en el JSON, solo no se lista.
   ═══════════════════════════════════════════════════════ */
var GAUF = '<svg viewBox="0 0 1202 404" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-gauf"><path d="M188.856.831C222.339-3.208 268.635 7.939 297.927 24.274 350.979 53.86 380.598 93.274 397.666 150.497 367.953 152.831 327.788 150.135 296.571 150.982 283.3 129.718 266.796 114.156 243.313 104.582 216.198 93.6 185.822 93.896 158.927 105.405 132.31 116.531 111.234 137.818 100.373 164.544 89.671 190.367 89.754 219.401 100.604 245.162 112.079 271.933 133.785 293.002 160.886 303.676 187.661 314.28 221.542 314.07 247.863 302.459 277.687 289.303 293.094 268.435 304.659 239.525L200.345 239.276C199.89 217.18 199.955 195.077 200.541 172.984L252.322 172.817 402.238 172.979C404.126 207.816 403.712 239.801 403.674 274.643L403.46 403.288 310.963 403.276C311.025 392.268 310.928 381.26 310.671 370.255 281.997 388.293 255.715 399.351 221.621 402.639 165.921 408.011 114.721 391.771 71.726 356.384 31.136 322.466 5.642 273.845.827 221.17-4.035 167.739 12.692 114.585 47.275 73.567 83.262 30.012 133.018 6.061 188.856.831Z" fill="currentColor"/><path d="M555.143.41C589.756.23 622.992 13.951 647.398 38.495 663.247 54.376 675.749 75.516 680.846 97.461 684.78 114.405 683.892 134.206 683.882 151.726L683.827 207.351 683.753 403.429 586.924 403.267 586.845 320.9 565.302 320.884 522.554 320.889 522.471 403.286 425.707 403.088 425.715 212.886 425.609 155.173C425.576 138.025 424.882 119.196 428.152 102.43 432.126 82.843 440.71 64.483 453.192 48.872 476.357 19.656 508.547 5.076 544.99.821 547.689.495 552.304.412 555.143.41ZM605.687 139.241C598.77 113.33 575.248 98.823 549.498 100.446 533.952 103.006 521.77 108.569 512.352 121.72 507.775 128.165 504.652 135.529 503.2 143.301 501.141 153.991 501.822 173.502 501.895 185.029L501.957 238.213 561.767 238.216 607.503 238.219 607.701 185.962C607.791 172.585 609.049 151.832 605.687 139.241Z" fill="currentColor"/><path d="M548.405 135.923C568.471 132.36 587.615 145.773 591.118 165.85 594.62 185.927 581.15 205.03 561.062 208.473 541.061 211.9 522.056 198.499 518.568 178.508 515.08 158.516 528.424 139.471 548.405 135.923Z" fill="#27D3CC"/><path d="M848.129.712C884.208-.092 922.018.493 958.228.603V102.707L958.258 229.55C958.268 252.2 959.908 296.358 954.948 316.797 950.288 335.639 940.598 352.863 926.918 366.632 864.334 429.595 733.308 411.581 708.525 317.965 703.753 299.939 704.944 276.703 704.971 258.035L704.987 202.448 705.062.709C741.159.078 778.46.545 814.652.601L814.677 189.44 814.655 245.859C814.602 256.847 814.202 267.816 814.631 278.798 815.038 289.202 817.077 300.412 829.874 301.351 834.659 301.721 839.378 300.051 842.866 296.755 850.133 289.931 848.062 265.765 848.09 255.393L848.15 195.566 848.129.712Z" fill="currentColor"/><path d="M981.497.724C1054.52-.247 1128.82.502 1201.91.602 1202.08 67.255 1158.61 125.379 1090.61 134.825 1082.71 135.923 1075.58 136.132 1067.59 136.286L1067.39 160.293 1168.78 160.379C1168.68 195.248 1162.99 213.949 1142.79 242.352 1124.32 264.638 1104.63 276.559 1076.24 282.654L1076.16 403.299 981.397 403.42 981.497.724Z" fill="currentColor"/></svg>';

var theme = 'dark';
try { theme = localStorage.getItem('gauf-theme') || 'dark'; } catch(e) {}
document.documentElement.setAttribute('data-theme', theme);
function toggleTheme(){
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('gauf-theme', theme); } catch(e) {}
  render();
}

var CHARLAS = [];
var ICON = {
  'Presentación':'▶', 'Canva':'▶', 'Google Slides':'▶', 'PDF':'⤓', 'Video':'►',
  'Artículo':'✎', 'Documento':'✎', 'Otro':'↗'
};

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* recursos: array {type,title,url,public}; acepta el formato viejo {presentation,pdf,video} */
function pubRes(list){
  if (list && !Array.isArray(list)) {
    var a = [];
    if (list.presentation) a.push({type:'Presentación', url:list.presentation});
    if (list.pdf) a.push({type:'PDF', url:list.pdf});
    if (list.video) a.push({type:'Video', url:list.video});
    list = a;
  }
  return (list || []).filter(function(r){ return r && r.url && r.public !== false; });
}
function resBtn(r, main){
  return '<a class="btn'+(main?' main':'')+'" href="'+esc(r.url)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'
    + (ICON[r.type] || '↗') + ' ' + esc(r.title || r.type) + '</a>';
}
function cover(c, big){
  if (c.cover) return '<div class="cover" style="background-image:url(\''+esc(c.cover)+'\')"></div>';
  return '<div class="cover none">'+(big?'':'<b>'+esc(c.title)+'</b>')+'</div>';
}
function fmtDate(d){
  if (!d) return '';
  var m = /^(\d{4})-(\d{2})/.exec(d);
  if (!m) return esc(d);
  return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m[2]-1] + ' ' + m[1];
}

function card(c){
  var res = pubRes(c.resources);
  return '<div class="card" role="link" tabindex="0" data-slug="'+esc(c.slug)+'">'
    + (c.cover ? cover(c) : "<div style=\"height:4px;background:var(--acc)\"></div>")
    + '<div class="cbody">'
      + ((c.tags||[]).length ? '<div class="tags">'+esc(c.tags.slice(0,3).join(' · '))+'</div>' : '')
      + '<h2>'+esc(c.title)+'</h2>'
      + (c.idea ? '<p>'+esc(c.idea)+'</p>' : '')
      + (res.length ? '<div class="btns">'+res.map(function(r,i){ return resBtn(r, i===0); }).join('')+'</div>' : '')
    + '</div></div>';
}

function head(){
  return '<header>'+GAUF+'<span class="t">Charlas</span><span class="sp"></span>'
    + '<button class="theme" onclick="toggleTheme()" aria-label="Cambiar tema">'+(theme==='dark'?'☀':'◑')+'</button></header>';
}
function foot(){
  return '<footer><span>GAUF · Charlas</span><a href="https://gaufgang.com">gaufgang.com</a></footer>';
}

function home(){
  return head()
    + '<section class="hero"><h1>Charlas<span>.</span></h1>'
    + '<p>Conversaciones sobre creatividad, comunicación y experiencias humanas.</p></section>'
    + (CHARLAS.length ? '<div class="grid">'+CHARLAS.map(card).join('')+'</div>' : '<div class="empty">Pronto, nuevas charlas.</div>')
    + foot();
}

function detail(slug){
  var c = CHARLAS.filter(function(x){ return x.slug === slug; })[0];
  if (!c) return head() + '<div class="detail"><a class="back" href="#/">← Todas las charlas</a><p class="empty">No encontrada.</p></div>' + foot();
  var res = pubRes(c.resources);
  var convs = (c.conversations || []).filter(function(v){ return v.visible !== false && v.event; });
  return head() + '<article class="detail">'
    + '<a class="back" href="#/">← Todas las charlas</a>'
    + (c.cover ? cover(c, true) : '')
    + ((c.tags||[]).length ? '<div class="tags">'+esc(c.tags.join(' · '))+'</div>' : '')
    + '<h1>'+esc(c.title)+'</h1>'
    + (c.idea ? '<div class="idea">'+esc(c.idea)+'</div>' : '')
    + (res.length ? '<div class="btns" style="margin-top:22px">'+res.map(function(r,i){ return resBtn(r, i===0); }).join('')+'</div>' : '')
    + (c.question ? '<div class="sec"><div class="sl">La pregunta</div><div class="q">'+esc(c.question)+'</div></div>' : '')
    + (c.summary ? '<div class="sec"><div class="sl">De qué se trata</div><p>'+esc(c.summary)+'</p></div>' : '')
    + (convs.length ? '<div class="sec"><div class="sl">Dónde la compartimos</div>' + convs.map(function(v){
        var vr = pubRes(v.resources);
        return '<div class="conv"><div><div class="ev">'+esc(v.event)+'</div>'
          + '<div class="meta">'+esc([v.organization, v.location].filter(Boolean).join(' · '))+'</div>'
          + (vr.length ? '<div class="btns">'+vr.map(function(r){ return resBtn(r); }).join('')+'</div>' : '')
          + '</div><div class="meta">'+fmtDate(v.date)+'</div></div>';
      }).join('') + '</div>' : '')
    + '</article>' + foot();
}

function render(){
  var h = location.hash.replace(/^#\/?/, '').replace(/^charla\//, '');  /* acepta links viejos #/charla/slug */
  document.getElementById('app').innerHTML = h ? detail(decodeURIComponent(h)) : home();
  var c = h && CHARLAS.filter(function(x){ return x.slug === h; })[0];
  document.title = (c ? c.title + ' — ' : 'Charlas — ') + 'Gabriel Aufgang';
}
/* tarjeta completa clickeable (sin anidar links) */
function openCard(e){
  var c = e.target.closest('.card');
  if (!c || e.target.closest('a')) return;
  if (e.type === 'keydown' && e.key !== 'Enter') return;
  location.hash = '#/' + c.getAttribute('data-slug');
}
document.addEventListener('click', openCard);
document.addEventListener('keydown', openCard);
window.addEventListener('hashchange', function(){ render(); window.scrollTo(0,0); });

fetch('charlas.json?t=' + Date.now())
  .then(function(r){ return r.json(); })
  .then(function(d){ CHARLAS = (d || []).filter(function(c){ return c.editorialStatus === 'public'; }); })
  .catch(function(){ CHARLAS = []; })
  .then(render);
</script>
</body>
</html>
