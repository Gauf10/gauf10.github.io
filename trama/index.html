<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#f5f2ec; --ink:#1a1a1a; --muted:#6b6b6b; --accent:#27D3CC; --accent-ink:#14a29c;
    --border:rgba(26,26,26,.14); --card:#fff; --error:#a3241b;
    --nav-h:54px; --serif:'Archivo Black',sans-serif; --body:'Archivo',sans-serif;
    --pad:clamp(1.25rem,4vw,4rem);
  }
  :root[data-theme="dark"]{
    --bg:#1a1a1a; --ink:#f5f2ec; --muted:#a8a49c; --accent-ink:#27D3CC;
    --border:rgba(245,242,236,.14); --card:#222; --error:#ff7a6b;
  }
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--body);font-size:17px;line-height:1.7;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{max-width:100%;height:auto;display:block}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* Nav (igual a la guía) */
  .nav{position:sticky;top:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
    padding:0 var(--pad);background:var(--accent);border-bottom:1px solid rgba(26,26,26,.1);--ink:#1a1a1a;color:#1a1a1a}
  .brand img{height:26px;width:auto}
  .nav-right{display:flex;align-items:center;gap:16px}
  .nav-back{font-size:13px;font-weight:500;letter-spacing:.03em;text-decoration:none;opacity:.7}
  .nav-back:hover{opacity:1}

  .wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

  /* Presentación + suscripción */
  .hero{padding:clamp(2.5rem,7vw,5.5rem) 0 clamp(2.5rem,6vw,4.5rem);display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);
    gap:clamp(2.5rem,7vw,6rem);align-items:start}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1a1a1a;font-size:11px;font-weight:500;letter-spacing:.09em;
    text-transform:uppercase;padding:6px 14px;border-radius:100px;margin-bottom:1.5rem}
  .intro p.pill,.hero p.pill{color:#1a1a1a}
  .pill::before{content:'';width:6px;height:6px;background:#1a1a1a;border-radius:50%}
  h1{font-family:var(--serif);font-size:clamp(40px,7.5vw,84px);line-height:1;letter-spacing:-.02em;margin-bottom:1.25rem}
  h1 span{color:var(--accent)}
  .bajada{font-size:clamp(18px,1.8vw,22px);line-height:1.45;max-width:30ch;margin-bottom:2rem}
  .intro p{max-width:58ch;margin-bottom:1em;color:var(--muted)}
  .intro p strong{color:var(--ink);font-weight:500}
  .temas{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.5rem}
  .temas span{font-size:13px;border:1px solid var(--border);border-radius:100px;padding:5px 13px}

  .form-card{position:sticky;top:calc(var(--nav-h) + 2rem);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(1.5rem,3vw,2rem)}
  .form-card h2{font-family:var(--serif);font-size:22px;line-height:1.15;margin-bottom:.4rem}
  .form-card .sub{font-size:14px;color:var(--muted);margin-bottom:1.5rem;line-height:1.55}
  .field{margin-bottom:1.2rem}
  .field label{display:block;font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
  .field input{width:100%;font:16px/1.4 var(--body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--border);padding:.55rem 0}
  .field input:focus{outline:none;border-bottom:2px solid var(--accent)}
  .field.invalid input{border-bottom-color:var(--error)}
  .field-error{display:none;font-size:13px;color:var(--error);margin-top:.35rem}
  .field.invalid .field-error{display:block}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .btn{display:inline-flex;align-items:center;justify-content:center;width:100%;background:var(--ink);color:var(--bg);font:500 15px var(--body);
    padding:15px 28px;border:0;border-radius:100px;cursor:pointer;transition:background .2s,color .2s;margin-top:.5rem}
  .btn:hover{background:var(--accent);color:#1a1a1a}
  .btn:disabled{opacity:.55;cursor:default}
  .legal{font-size:12px;color:var(--muted);margin-top:1rem;line-height:1.5}
  .status{font-size:14px;margin-top:.9rem;min-height:1.4em}
  .status.err{color:var(--error)}
  .ok-box{display:none;text-align:center;padding:1rem 0}
  .ok-box.on{display:block}
  .ok-box b{font-family:var(--serif);font-size:22px;display:block;margin-bottom:.5rem}
  .ok-box p{color:var(--muted);font-size:15px}

  /* Archivo de ediciones (como charlas) */
  .archivo{border-top:1px solid var(--border);padding:clamp(2.5rem,6vw,4rem) 0 5rem}
  .sec-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
  .sec-label::before{content:'';width:28px;height:1px;background:currentColor}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card .cover{aspect-ratio:16/9;background:#111 center/cover no-repeat}
  .card .bar{height:4px;background:var(--accent)}
  .cbody{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .num{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
  .cbody h3{font:400 20px/1.2 var(--serif)}
  .cbody p{color:var(--muted);font-size:15px;line-height:1.55}
  .more{margin-top:auto;padding-top:6px;font-size:13px;font-weight:600;color:var(--accent-ink)}
  .empty{color:var(--muted);font-size:15px}

  /* Edición */
  .edicion{max-width:680px;margin:0 auto;padding:clamp(2rem,5vw,3.5rem) 0 4rem}
  .back{font-size:14px;color:var(--muted);text-decoration:none;display:inline-block;margin-bottom:1.75rem}
  .back:hover{color:var(--accent-ink)}
  .edicion h1{font-size:clamp(32px,5.5vw,54px);line-height:1.05;margin:.6rem 0 1rem}
  .edicion .lead{font-size:20px;line-height:1.5;color:var(--muted);margin-bottom:2rem}
  .edicion .cover{border-radius:14px;margin-bottom:2rem;aspect-ratio:16/9;background:#111 center/cover no-repeat}
  .cuerpo{font-size:18px;line-height:1.75}
  .cuerpo p{margin-bottom:1.15em}
  .cuerpo h2{font:400 26px/1.2 var(--serif);margin:2.2rem 0 .9rem}
  .cuerpo h3{font-size:19px;font-weight:600;margin:1.8rem 0 .6rem}
  .cuerpo a{color:var(--accent-ink);text-underline-offset:3px}
  .cuerpo blockquote{border-left:3px solid var(--accent);padding-left:1.1rem;margin:1.6rem 0;font-size:20px;line-height:1.5}
  .cuerpo ul,.cuerpo ol{padding-left:1.3rem;margin-bottom:1.15em}
  .cuerpo li{margin-bottom:.35em}
  .cuerpo img{border-radius:10px;margin:1.6rem 0}
  .cuerpo hr{border:0;border-top:1px solid var(--border);margin:2.2rem 0}
  .fin{margin-top:3rem;padding:1.75rem;border:1px solid var(--border);border-radius:14px;background:var(--card)}
  .fin b{font-family:var(--serif);font-size:20px;display:block;margin-bottom:.35rem}
  .fin p{color:var(--muted);font-size:15px;margin-bottom:1rem}
  .fin a.btn{width:auto;text-decoration:none}

  footer{background:#1a1a1a;color:rgba(245,242,236,.58);padding:2.5rem var(--pad);display:flex;flex-direction:column;align-items:center;gap:1rem;font-size:12px}
  [data-theme="dark"] footer{background:#0f0f0f}
  .footer-logo img{height:28px;filter:brightness(0) invert(1);opacity:.9}
  .footer-links{display:flex;gap:1.5rem}
  .footer-links a{color:rgba(245,242,236,.58);text-decoration:none;font-size:13px}
  .footer-links a:hover{color:var(--accent)}

  @media (max-width:880px){
    .hero{grid-template-columns:1fr}
    .form-card{position:static}
  }
</style>
</head>
<body>

</header>

<main id="app"></main>

<footer>
  <div class="footer-logo"><img src="../images/logo_negro.svg" alt="Gauf" width="1202" height="404"></div>
  <div>Gabriel Aufgang · Trama invisible</div>
  <div class="footer-links">
    <a href="https://gaufgang.com/guia/">Guía gratuita</a>
    <a href="https://www.linkedin.com/in/gaufgang/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://www.instagram.com/gaufgang/" target="_blank" rel="noopener">Instagram</a>
  </div>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════
   TRAMA INVISIBLE
   · Presentación + suscripción (nombre y email) + archivo.
   · Las ediciones se cargan desde trama/admin.html y viven en
     trama/ediciones.json. Solo se listan las "publicada": true.
   · La suscripción usa la misma función que la guía
     (Supabase → MailerLite, grupo TRAMA INVISIBLE),
     marcada con utm_source "trama" para distinguirla.
   ═══════════════════════════════════════════════════════════ */
var ENDPOINT = 'https://qjahvfyixsuljtxqipbs.supabase.co/functions/v1/registrar-descarga';
var EDICIONES = [];

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function track(ev, p){ try { if (typeof gtag === 'function') gtag('event', ev, p || {}); } catch (e) {} }
function fecha(d){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
  if (!m) return esc(d || '');
  return (+m[3]) + ' de ' + ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+m[2]-1] + ' de ' + m[1];
}

/* Markdown simple: ## título, **negrita**, *itálica*, [texto](url), ![](img), > cita, - lista, 1. lista, --- */
function md(src){
  function inl(t){
    return esc(t)
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1" loading="lazy">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$1</em>');
  }
  var out = [], list = null, para = [];
  function flushP(){ if (para.length) { out.push('<p>' + inl(para.join(' ')) + '</p>'); para = []; } }
  function flushL(){ if (list) { out.push('<' + list.t + '>' + list.items.map(function(i){ return '<li>' + inl(i) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; } }
  (src || '').split(/\r?\n/).forEach(function(raw){
    var l = raw.trim(), m;
    if (!l) { flushP(); flushL(); return; }
    if (/^---+$/.test(l)) { flushP(); flushL(); out.push('<hr>'); return; }
    if ((m = /^(#{2,3})\s+(.*)$/.exec(l))) { flushP(); flushL(); out.push('<h' + m[1].length + '>' + inl(m[2]) + '</h' + m[1].length + '>'); return; }
    if ((m = /^>\s?(.*)$/.exec(l))) { flushP(); flushL(); out.push('<blockquote>' + inl(m[1]) + '</blockquote>'); return; }
    if ((m = /^[-*]\s+(.*)$/.exec(l))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = {t:'ul', items:[]}; } list.items.push(m[1]); return; }
    if ((m = /^\d+[.)]\s+(.*)$/.exec(l))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = {t:'ol', items:[]}; } list.items.push(m[1]); return; }
    if (/^!\[/.test(l)) { flushP(); flushL(); out.push(inl(l)); return; }
    flushL(); para.push(l);
  });
  flushP(); flushL();
  return out.join('\n');
}

/* ───────── vistas ───────── */
function formHTML(){
  return '<div class="form-card" id="suscribirse">'
    + '<div id="form-view"><h2>Suscribite</h2>'
    + '<p class="sub">Cada dos semanas, más o menos. Sin spam: podés darte de baja cuando quieras.</p>'
    + '<form id="form-trama" novalidate>'
    +   '<div class="field" id="f-nombre"><label for="nombre">Nombre</label><input type="text" id="nombre" autocomplete="given-name" placeholder="Tu nombre" required><p class="field-error">Escribí tu nombre para poder saludarte.</p></div>'
    +   '<div class="field" id="f-email"><label for="email">Email</label><input type="email" id="email" autocomplete="email" inputmode="email" placeholder="vos@email.com" required><p class="field-error">Revisá el email: parece que falta algo.</p></div>'
    +   '<div class="hp" aria-hidden="true"><label for="website">No completar</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>'
    +   '<button class="btn" type="submit" id="btn-sus">Quiero recibir Trama</button>'
    +   '<p class="status" id="status" role="status" aria-live="polite"></p>'
    + '</form></div>'
    + '<div class="ok-box" id="ok-box" tabindex="-1"><b>¡Listo, gracias!</b><p>Ya estás en la lista. La próxima edición llega a tu correo.</p></div>'
    + '</div>';
}

function cardHTML(e, i){
  return '<a class="card" href="#/' + esc(e.slug) + '">'
    + (e.cover ? '<div class="cover" style="background-image:url(\'' + esc(e.cover) + '\')"></div>' : '<div class="bar"></div>')
    + '<div class="cbody"><div class="num">' + (e.numero ? 'Edición ' + esc(e.numero) + ' · ' : '') + fecha(e.fecha) + '</div>'
    + '<h3>' + esc(e.titulo) + '</h3>'
    + (e.bajada ? '<p>' + esc(e.bajada) + '</p>' : '')
    + '<span class="more">Leer →</span></div></a>';
}

function home(){
  return '<div class="wrap"><section class="hero">'
    + '<div class="intro">'
    +   '<p class="pill">Newsletter</p>'
    +   '<h1>Trama<br>invisible<span>.</span></h1>'
    +   '<p class="bajada">Ideas y experiencias que conectan mundos y abren posibilidades.</p>'
    +   '<p>Un espacio para compartir lo que pienso, exploro y aprendo. <strong>Lo valioso muchas veces aparece en las conexiones</strong>: entre personas, disciplinas, experiencias e ideas.</p>'
    +   '<p>Cada edición puede traer una reflexión propia, una referencia que me movió, un ejercicio para poner en juego o algo que descubrí improvisando. No todas traen todo.</p>'
    +   '<p>La idea es simple: que cada envío te deje <strong>una idea, una pregunta o una posibilidad nueva</strong> para explorar.</p>'
    +   '<div class="temas"><span>Liderazgo humano</span><span>Conversaciones</span><span>Creatividad</span><span>Co-creación</span><span>Emprendimiento</span><span>Improvisación</span><span>Diseño de experiencias</span><span>IA y personas</span></div>'
    + '</div>'
    + formHTML()
    + '</section>'
    + '<section class="archivo"><div class="sec-label">Ediciones</div>'
    + (EDICIONES.length ? '<div class="grid">' + EDICIONES.map(cardHTML).join('') + '</div>' : '<p class="empty">La primera edición está en camino. Suscribite para recibirla.</p>')
    + '</section></div>';
}

function edicion(slug){
  var e = EDICIONES.filter(function(x){ return x.slug === slug; })[0];
  if (!e) return '<div class="wrap"><article class="edicion"><a class="back" href="#/">← Trama invisible</a><p class="empty">No encontramos esta edición.</p></article></div>';
  return '<div class="wrap"><article class="edicion">'
    + '<a class="back" href="#/">← Trama invisible</a>'
    + '<div class="num">' + (e.numero ? 'Edición ' + esc(e.numero) + ' · ' : '') + fecha(e.fecha) + '</div>'
    + '<h1>' + esc(e.titulo) + '</h1>'
    + (e.bajada ? '<p class="lead">' + esc(e.bajada) + '</p>' : '')
    + (e.cover ? '<div class="cover" style="background-image:url(\'' + esc(e.cover) + '\')"></div>' : '')
    + '<div class="cuerpo">' + md(e.cuerpo) + '</div>'
    + '<div class="fin"><b>¿Te gustó?</b><p>Suscribite y recibí la próxima en tu correo.</p><a class="btn" href="#/suscribirse">Suscribirme</a></div>'
    + '</article></div>';
}

function render(){
  var h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  var app = document.getElementById('app');
  if (h && h !== 'suscribirse') {
    app.innerHTML = edicion(h);
    var e = EDICIONES.filter(function(x){ return x.slug === h; })[0];
    document.title = (e ? e.titulo + ' · ' : '') + 'Trama invisible';
    window.scrollTo(0, 0);
  } else {
    app.innerHTML = home();
    document.title = 'Trama invisible | Newsletter de Gauf';
    bindForm();
    if (h === 'suscribirse') { var f = document.getElementById('suscribirse'); if (f) f.scrollIntoView({behavior:'smooth', block:'start'}); var n = document.getElementById('nombre'); if (n) setTimeout(function(){ n.focus(); }, 400); }
  }
}
window.addEventListener('hashchange', render);

/* ───────── suscripción ───────── */
var UTMS = (function(){ var q = new URLSearchParams(location.search), o = {}; ['utm_source','utm_medium','utm_campaign'].forEach(function(k){ if (q.get(k)) o[k] = q.get(k).slice(0, 100); }); return o; })();
function uid(){ try { return crypto.randomUUID(); } catch (e) { return 'ev-' + Date.now() + '-' + Math.random().toString(16).slice(2); } }

function bindForm(){
  var form = document.getElementById('form-trama');
  if (!form) return;
  var enviando = false, eventId = uid();
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (enviando) return;
    var nombre = document.getElementById('nombre').value.trim().slice(0, 80);
    var email = document.getElementById('email').value.trim().toLowerCase().slice(0, 160);
    var okN = nombre.length > 0, okE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    document.getElementById('f-nombre').classList.toggle('invalid', !okN);
    document.getElementById('f-email').classList.toggle('invalid', !okE);
    var st = document.getElementById('status');
    if (!okN || !okE) { st.textContent = 'Revisá los campos marcados.'; st.className = 'status err'; return; }
    enviando = true;
    var btn = document.getElementById('btn-sus'); btn.disabled = true; btn.textContent = 'Enviando…';
    st.textContent = ''; st.className = 'status';
    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        name: nombre, email: email, newsletter_consent: true,
        utm_source: UTMS.utm_source || 'trama', utm_medium: UTMS.utm_medium || 'suscripcion', utm_campaign: UTMS.utm_campaign || null,
        website: document.getElementById('website').value, event_id: eventId
      })
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok || j.ok !== true) throw new Error('x'); return j; }); })
    .then(function(){
      track('newsletter_subscribe', { origen: 'trama' });
      document.getElementById('form-view').style.display = 'none';
      var ok = document.getElementById('ok-box'); ok.classList.add('on'); ok.focus();
    })
    .catch(function(){
      enviando = false; btn.disabled = false; btn.textContent = 'Quiero recibir Trama';
      st.innerHTML = 'No se pudo completar. Probá de nuevo o escribime a <a href="mailto:hablemos@gaufgang.com">hablemos@gaufgang.com</a>.';
      st.className = 'status err';
    });
  });
}

/* ───────── carga ───────── */
fetch('ediciones.json?t=' + Date.now())
  .then(function(r){ return r.ok ? r.json() : []; })
  .then(function(d){
    EDICIONES = (Array.isArray(d) ? d : []).filter(function(e){ return e && e.publicada; })
      .sort(function(a, b){ return (b.fecha || '').localeCompare(a.fecha || ''); });
  })
  .catch(function(){ EDICIONES = []; })
  .then(render);
</script>
</body>
</html>
